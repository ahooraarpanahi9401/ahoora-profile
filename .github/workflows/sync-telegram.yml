name: Sync Telegram Profile

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:          # manual trigger
  push:
    paths:
      - 'profile.json'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch & parse Telegram profile
        run: |
          python3 - <<'PY'
          import re, json, urllib.request

          url = "https://t.me/heavenlydemongoddd"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              html = r.read().decode("utf-8", "ignore")

          def og(prop):
              m = re.search(r'<meta property="og:' + prop + r'" content="([^"]*)"', html)
              return m.group(1) if m else None

          name = og("title") or "Ahoora"
          # bio: keep the user's chosen text (do not overwrite from Telegram)
          bio = "In the name of the Lord of soul and wisdom,\nbeyond whom no higher thought can pass 🌹"
          # avatar: use the user's chosen local image (assets/avatar.jpg)
          photo = "assets/avatar.jpg"

          # handle is fixed
          handle = "@heavenlydemongoddd"

          profile = {
            "name": name,
            "handle": handle,
            "bio": bio,
            "avatar": photo,
            "track": {
              "title": "نام جاوید وطن",
              "artist": "سالار عقیلی",
              "src": "https://dl.musicviral.ir/Music/1404-03/Nam%20Javid%20Vatan%20Salar%20Aghili.mp3"
            },
            "telegram": "https://t.me/heavenlydemongoddd",
            "spotify": "https://open.spotify.com/user/31qru4dr45mswzyc6miz5ogkwlbe",
            "github": "https://github.com/ahooraarpanahi9401"
          }

          with open("profile.json", "w", encoding="utf-8") as f:
              json.dump(profile, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(json.dumps(profile, ensure_ascii=False, indent=2))
          PY

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync telegram profile [skip ci]"
            git push
          fi